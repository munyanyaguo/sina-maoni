services:
  postgres:
    image: postgres:16-alpine
    container_name: sina-maoni-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sina
      POSTGRES_PASSWORD: sina
      POSTGRES_DB: sina_maoni
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sina -d sina_maoni"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
