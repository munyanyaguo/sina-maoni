name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sina
          POSTGRES_PASSWORD: sina
          POSTGRES_DB: sina_maoni
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sina -d sina_maoni"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sina:sina@localhost:5432/sina_maoni
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      # Version comes from the "packageManager" field; setting it here too is an error.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint:repo

      - name: Type-check
        run: pnpm type-check:repo

      - name: Test
        run: pnpm test:repo

      - name: Build
        run: pnpm build:repo

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      # No dependency cache here: this job never installs, it only reads the lockfile.
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Audit dependencies
        run: pnpm audit --audit-level high
