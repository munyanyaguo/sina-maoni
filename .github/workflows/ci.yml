name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

jobs:
  ci:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (turbo lint)
        run: pnpm lint:repo

      - name: Type-check (turbo type-check)
        run: pnpm type-check:repo

      - name: Test (turbo test)
        run: pnpm test:repo

      - name: Build (turbo build)
        run: pnpm build:repo