packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

allowBuilds:
  esbuild: true
  sharp: true
  spawn-sync: true

# pnpm >=10 blocks lifecycle scripts unless explicitly allowed.
onlyBuiltDependencies:
  - "@swc/core"
  - "@tailwindcss/oxide"
  - "esbuild"
  - "sharp"
  - "unrs-resolver"

# Transitive build-tooling packages with published advisories. None ship in
# application runtime code; all come via wxt / tauri-cli / turbo.
overrides:
  "tar@<7.5.19": ">=7.5.19"
  "shell-quote@<1.8.5": ">=1.8.5"
  "tmp@<0.2.6": ">=0.2.6"
  "adm-zip@<0.6.0": ">=0.6.0"
  "brace-expansion@1": ">=1.1.18"
  "js-yaml@<4.3.1": ">=4.3.1"
